name: Theo doi follow

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/follow-alert-telegram-1060
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --ignore-scripts

      - name: Bao mot lan la tool dang chay
        run: |
          mkdir -p data/follows
          if [ ! -f data/follows/watcher-on ]; then
            node src/follow-alert.js --online
            touch data/follows/watcher-on
          fi

      - name: Kiem tra follow moi
        run: node src/follow-alert.js --once

      - name: Luu danh sach da thay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/follows
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Nho danh sach follow da thay"
          git push origin HEAD:cursor/follow-alert-telegram-1060
